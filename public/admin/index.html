<!doctype html>
<html>
<head><meta name="google-site-verification" content="YtZTPtcUxGTQ3OgV2Nq0SphmwDyQNzyDsuqHQyq5arw" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio-Gaz-Benin-Afrique — Administration</title>
  <!-- Ce panneau est servi automatiquement par Netlify sur /admin une fois déployé.
       Aucune installation séparée n'est nécessaire : Netlify Identity + Git Gateway
       gèrent la connexion et les rôles (voir README.md). -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>
