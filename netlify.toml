[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------- Identity / Git Gateway ----------
# Active dans l'interface Netlify : Site settings > Identity > Enable Identity
# puis Services > Git Gateway. C'est ce qui permet à /admin (Decap CMS) de
# committer sur le dépôt au nom d'utilisateurs authentifiés, sans exposer
# de token GitHub personnel dans le code.

# ---------- En-têtes de sécurité (appliqués à toutes les pages) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-ancestors 'self'"
# L'admin CMS a besoin d'un peu plus de latitude pour charger Decap CMS
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-ancestors 'self'"

# ---------- Ressources protégées (Phase 2) ----------
# Une fois Supabase branché (voir SECURITY.md), les téléchargements de la
# bibliothèque documentaire passeront par une Netlify Function qui vérifie
# le rôle de l'utilisateur avant de servir le fichier — pas de lien direct
# public vers les documents "Partenaires" / "Investisseurs" / "Admin".

# ---------- Redirections utiles ----------
[[redirects]]
  from = "/devis"
  to = "/contact#devis"
  status = 301

# Note : la racine "/" et le routage FR/EN sont gérés par middleware.ts
# (redirection vers /fr ou /en selon la langue du navigateur), pas par des
# redirections Netlify statiques — ce projet est une app Next.js rendue
# côté serveur via @netlify/plugin-nextjs, pas un SPA avec un index.html.
